[package]
name = "lean_string"
description = "Compact, clone-on-write string."
version = "0.6.1"
edition = "2024"
authors = ["ryota2357"]
repository = "https://github.com/ryota2357/lean_string"
readme = "README.md"
license = "MIT"
keywords = ["string", "sso", "cow"]
categories = ["data-structures", "no-std"]

[features]
default = ["std"]
std = []
serde = ["dep:serde_core"]

[dependencies]
itoa = "1.0"
ryu = "1.0"
castaway = { version = "0.2.4", default-features = false, features = ["alloc"] }
arbitrary = { version = "1", optional = true, default-features = false }
serde_core = { version = "1.0", optional = true, default-features = false }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "=5.0.1", default-features = false, features = ["cargo_bench_support"] }
paste = "1.0.15"
proptest = { version = "1.11.0", features = ["attr-macro"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "collection"
harness = false

[[bench]]
name = "mutation"
harness = false

[[bench]]
name = "heap_layout"
harness = false

[[bench]]
name = "direct_initialization"
harness = false

[target.'cfg(loom)']
dependencies.loom = { version = "0.7.2", optional = true }
dev-dependencies.dhat = "0.3.3"

# https://github.com/tokio-rs/loom/issues/352
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
